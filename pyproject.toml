[project]
name = "op"
version = "0.1.0"
dependencies = [
    "python-dotenv>=1.2.2",
    "pydantic==2.13.4"
]

[project.scripts]
op = "op.op:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]
